<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma 3 270M - Vue.js Chat Interface</title>
    <!-- Import Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #1f2937;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-content h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #111827;
        }
        .header-content p {
            margin: 5px 0 0;
            font-size: 0.875rem;
            color: #6b7280;
        }
        #clear-btn {
            padding: 8px 12px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        #clear-btn:hover { background-color: #dc2626; }
        
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #f9fafb;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            opacity: 1;
            white-space: pre-wrap;
        }
        .user-message {
            align-self: flex-end;
            background-color: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            align-self: flex-start;
            background-color: white;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .input-area {
            padding: 20px;
            background-color: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.15s ease-in-out;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        button#send-btn {
            padding: 10px 20px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
        }
        button#send-btn:hover:not(:disabled) {
            background-color: #2563eb;
        }
        button#send-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .status-bar {
            padding: 8px 20px;
            background-color: #f3f4f6;
            border-top: 1px solid #e5e7eb;
            font-size: 0.75rem;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(4px);
        }
        
        /* Vue transition for messages */
        .message-enter-active {
            transition: opacity 0.3s ease;
        }
        .message-enter-from {
            opacity: 0;
        }
    </style>
</head>
<body>

<div id="app">
    <div v-if="isLoading" id="loading-overlay">
        <div id="loading-text" style="font-weight: 500; color: #4b5563;">Initializing Vue & Model...</div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Gemma 3 270M (Persistent)</h1>
                <p>Vue.js 3 + LocalStorage Caching</p>
            </div>
            <button id="clear-btn" @click="clearMessages">Clear Chat</button>
        </div>
        
        <div id="chat-container" ref="chatContainer">
            <transition-group name="message">
                <div v-for="msg in messages"
                     :key="msg.id"
                     :class="['message', msg.role + '-message']">
                    {{ msg.content }}
                </div>
            </transition-group>
        </div>
        
        <div class="input-area">
            <input 
                type="text" 
                v-model="inputText"
                id="user-input"
                placeholder="Type your message..."
                :disabled="isGenerating || isLoading"
                autocomplete="off"
                @keypress.enter="sendMessage"
            >
            <button
                id="send-btn"
                @click="sendMessage"
                :disabled="isGenerating || isLoading || !inputText.trim()"
            >
                Send
            </button>
        </div>

        <div class="status-bar">
            <span id="status-text">{{ statusText }}</span>
            <span id="device-info">{{ deviceInfo }}</span>
        </div>
    </div>
</div>

<script type="module">
    const { createApp, ref, onMounted, nextTick, watch } = Vue;

    // --- Worker Code ---
    const workerCode = `
    import { pipeline, TextStreamer, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/dist/transformers.min.js';
    env.allowLocalModels = false;
    env.useBrowserCache = true;
    let generator = null;
    let history = [];

    self.addEventListener('message', async (event) => {
        const { type, data } = event.data;

        if (type === 'init') {
            try {
                self.postMessage({ type: 'status', data: { message: 'Loading model...' } });
                const modelId = 'onnx-community/gemma-3-270m-it-ONNX';

                try {
                    generator = await pipeline('text-generation', modelId, {
                        dtype: 'q4', device: 'webgpu',
                        progress_callback: (p) => {
                            if(p.status==='progress') self.postMessage({type:'progress', data:p});
                        }
                    });
                    self.postMessage({ type: 'ready', data: { device: 'webgpu' } });
                } catch(e) {
                    console.warn("WebGPU failed, trying WASM", e);
                    generator = await pipeline('text-generation', modelId, {
                        dtype: 'q4', device: 'wasm',
                        progress_callback: (p) => {
                            if(p.status==='progress') self.postMessage({type:'progress', data:p});
                        }
                    });
                    self.postMessage({ type: 'ready', data: { device: 'wasm' } });
                }
            } catch (err) {
                self.postMessage({ type: 'error', data: err.message });
            }
        } else if (type === 'restore') {
            history = data.map(m => ({
                role: m.role === 'bot' ? 'assistant' : 'user',
                content: m.content
            }));
        } else if (type === 'reset') {
            history = [];
        } else if (type === 'generate') {
            history.push({ role: 'user', content: data.message });
            if(history.length > 10) history = history.slice(-10);

            const streamer = new TextStreamer(generator.tokenizer, {
                skip_prompt: true, skip_special_tokens: true,
                callback_function: (token) => self.postMessage({ type: 'token', data: token })
            });

            try {
                const output = await generator(history, {
                    max_new_tokens: 256, temperature: 0.7, top_p: 0.95, do_sample: true, streamer
                });
                const response = output[0].generated_text.at(-1).content;
                history.push({ role: 'assistant', content: response });
                self.postMessage({ type: 'complete' });
            } catch (err) {
                self.postMessage({ type: 'error', data: err.message });
            }
        }
    });
    `;

    createApp({
        setup() {
            const STORAGE_KEY = 'gemma_chat_history';
            const messages = ref([]);
            const inputText = ref('');
            const isGenerating = ref(false);
            const isLoading = ref(true);
            const statusText = ref('Initializing...');
            const deviceInfo = ref('Checking device...');
            const chatContainer = ref(null);
            let worker = null;

            const loadMessages = () => {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    messages.value = JSON.parse(stored);
                } else {
                    messages.value = [
                        { id: 0, role: 'bot', content: "Hello! I am Gemma 3 270M (Vue.js). I remember our conversation even if you reload!" }
                    ];
                }
            };

            const saveMessages = () => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.value));
            };

            const scrollToBottom = async () => {
                await nextTick();
                if (chatContainer.value) {
                    chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
                }
            };

            // Watch messages to save and scroll
            watch(messages, () => {
                saveMessages();
                scrollToBottom();
            }, { deep: true });

            const clearMessages = () => {
                localStorage.removeItem(STORAGE_KEY);
                messages.value = [{ id: 0, role: 'bot', content: "Chat history cleared." }];
                if (worker) worker.postMessage({ type: 'reset' });
            };

            const sendMessage = () => {
                const text = inputText.value.trim();
                if (!text || isGenerating.value) return;

                messages.value.push({ id: Date.now(), role: 'user', content: text });
                messages.value.push({ id: Date.now() + 1, role: 'bot', content: "" });

                inputText.value = '';
                isGenerating.value = true;
                statusText.value = 'Generating...';

                worker.postMessage({ type: 'generate', data: { message: text } });
            };

            // Expose helpers for Playwright
            window._appendToken = (token) => {
                const lastMsg = messages.value[messages.value.length - 1];
                if (lastMsg && lastMsg.role === 'bot') {
                    lastMsg.content += token;
                }
            };
            window._setGenerating = (val) => {
                isGenerating.value = val;
                if (!val) statusText.value = 'Ready';
            };

            onMounted(() => {
                loadMessages();
                scrollToBottom();

                const blob = new Blob([workerCode], { type: 'application/javascript' });
                worker = new Worker(URL.createObjectURL(blob), { type: 'module' });

                worker.onmessage = (e) => {
                    const { type, data } = e.data;
                    if (type === 'ready') {
                        isLoading.value = false;
                        statusText.value = 'Ready';
                        deviceInfo.value = 'Running on ' + (data.device === 'webgpu' ? 'WebGPU' : 'WASM');

                        const historyToRestore = messages.value.map(m => ({ role: m.role, content: m.content }));
                        worker.postMessage({ type: 'restore', data: historyToRestore });
                    } else if (type === 'token') {
                        // Use the reactive state directly
                        const lastMsg = messages.value[messages.value.length - 1];
                        if (lastMsg && lastMsg.role === 'bot') {
                            lastMsg.content += data;
                        }
                    } else if (type === 'complete') {
                        isGenerating.value = false;
                        statusText.value = 'Ready';
                        // Focus logic would go here if we had a ref to input, but v-model handles state
                        document.getElementById('user-input').focus();
                    } else if (type === 'status') {
                        statusText.value = data.message;
                    } else if (type === 'error') {
                        alert('Error: ' + data);
                        isGenerating.value = false;
                        statusText.value = 'Error';
                    }
                };

                worker.postMessage({ type: 'init' });
            });

            return {
                messages,
                inputText,
                isGenerating,
                isLoading,
                statusText,
                deviceInfo,
                chatContainer,
                sendMessage,
                clearMessages
            };
        }
    }).mount('#app');
</script>
</body>
</html>
